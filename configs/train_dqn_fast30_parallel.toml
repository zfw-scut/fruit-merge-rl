# 配置用途：DQN fast30 并行训练的正式参数集合。
#
# 字段规则：TOML 字段名和训练脚本参数一一对应。
# 写法转换：命令行短横线参数在 TOML 中改成下划线，例如 --total-updates 对应 total_updates。

[runtime]
# 输出目录：保存 metrics、episode_metrics、checkpoint、plots 等训练产物。
run_dir = "runs/dqn_causal_fast30_h128_l3_n3_500k"

# 训练设备：模型参数更新使用的 PyTorch 设备，可选 "cuda"、"cuda:0" 或 "cpu"。
device = "cuda"

[training]
# 更新次数：DQN 参数更新总次数；一次 update 是一次 batch 训练，不是一局游戏。
total_updates = 500000

# 预热经验：正式训练前随机采集多少条经验，用于填充 ReplayBuffer。
warmup_steps = 5000

# 每轮采集：3 个 rollout worker 各采集 3 次，保持每次更新共 9 条真实投放经验。
collect_per_update = 9

# 批大小：每次训练从 ReplayBuffer 采样多少条 transition。
batch_size = 64

[replay]
# 总容量：ReplayBuffer 最多保留多少条经验。
replay_capacity = 100000

# 热数据容量：常驻内存的最新经验数量；旧经验会进入冷磁盘层。
hot_replay_capacity = 8000

# 冷段大小：冷磁盘 replay 每多少条 transition 写成一个段文件。
replay_segment_size = 1024

# 冷缓存容量：训练采样时缓存多少条冷 replay 到内存，减少频繁读盘。
replay_cold_cache_size = 2048

# 冷采样比例：每个 batch 中期望来自冷 replay 的比例。
replay_cold_sample_ratio = 0.25

# 冷缓存刷新：每多少次 sample 刷新一次冷 replay 缓存。
replay_cold_cache_refresh_interval = 500

[epsilon]
# 衰减方式：smooth 按总训练进度平滑下降，linear 按 env_steps 线性下降。
epsilon_schedule = "smooth"

# 初始探索率：训练开始时随机选动作的概率。
epsilon_start = 1.0

# 最终探索率：训练后期保留的随机选动作概率。
epsilon_end = 0.05

# 线性衰减步数：仅 linear 模式使用，表示 epsilon 从 start 衰减到 end 需要的环境步数。
epsilon_decay_steps = 50000

[dqn]
# 学习率：Adam 优化器的 learning rate。
learning_rate = 1e-4

# 折扣因子：未来奖励在 TD target 中的折扣权重。
gamma = 0.99

# 多步回报：每个 worker 按连续轨迹构造 3-step return，终局尾部自然缩短。
n_step = 3

# 目标网络同步：target network 每多少次 update 同步一次 online network。
target_update_interval = 1000

# 梯度裁剪：限制梯度范数，防止训练初期 Q 值和梯度爆炸；0 表示关闭。
grad_clip_norm = 10.0

[causal]
# 因果回放独立于主 TD replay，只保留规则动作对、反事实差值和局部 Shapley。
causal_replay_capacity = 20000

# 因果 batch 和更新间隔：每两次 TD update 最多联合训练 32 条稀疏样本。
causal_batch_size = 32
causal_update_interval = 2

# 第一次正式长训直接启用完整规则排序和稀疏反事实监督。
lambda_rule = 0.15
lambda_cf = 0.10

# 7 级合成效用 2**2.5，用于归一化跨分支 return 差值。
counterfactual_return_scale = 5.656854249492381
counterfactual_target_clip = 5.0

[counterfactual]
# worker 侧只保存最近 32 个稳定动作边界；主进程按 CPU 余量自动预留独立进程。
counterfactual_enabled = true
# 首轮云容器只有 6 个 cgroup 有效核：3 个 rollout、2 个物理归因（其中 1 个
# 专供 Shapley）和 1 个主进程。预检按真实配额拒绝任何过额启动。
counterfactual_workers = 2
counterfactual_horizon = 10
counterfactual_cost_ratio = 0.06
counterfactual_hard_limit = 0.10
counterfactual_min_real_steps = 256
counterfactual_cpu_core_ratio = 0.34
counterfactual_queue_capacity = 256
counterfactual_snapshot_ring_size = 32
# 常规 proposal（包括连锁与规则冲突）只稳定抽取 1/16 跨进程传输；
# 7 级以上高价值合成无条件保留。完整状态分析、规则归因和快照历史仍逐步执行。
counterfactual_proposal_sample_rate = 0.0625
counterfactual_max_alternatives = 2
counterfactual_max_inflight_per_worker = 2
counterfactual_circuit_breaker_failures = 5
counterfactual_soft_borrow_priority = 10.0

[shapley]
# 只对累计约 0.05% 的最高价值、多动作协同事件运行局部 Shapley。
# 最多 3 个候选可把 subset 上限控制在 8 个，且与普通反事实共用 10% 硬预算。
shapley_enabled = true
shapley_event_ratio_max = 0.0005
shapley_candidate_limit = 3
shapley_paired_permutations = 4
shapley_minimum_candidates = 2
shapley_minimum_utility = 5.656854249492381
shapley_pending_capacity = 4

[model]
# 隐藏维度：GNN hidden_dim；越大表达能力越强，但显存和计算开销越高。
hidden_dim = 128

# 消息层数：message passing 层数；越多能传播更远的图信息，但也更慢。
message_layers = 3

# Dropout：模型 dropout 概率；当前默认关闭。
dropout = 0.0

# 激活函数：GNN 内部 MLP 使用的激活函数，当前可选 "silu" 或 "relu"。
activation = "silu"

[environment]
# 随机种子：控制环境、策略和 replay 采样的基础随机种子。
seed = 0

# 动作数量：离散投放候选动作数量。
action_count = 15

# 物理模式：fast30 会使用 30fps、较少稳定帧和较少 Pymunk 迭代次数。
physics_mode = "fast30"

[parallel]
# 并行环境数：按首轮云容器的 6 核 cgroup 配额冻结为 3。
num_envs = 3

# Worker 同步：并行 worker 每多少次 update 同步一次 online model 参数。
worker_sync_interval = 100

# 异步采样：是否让下一批 rollout 和当前 DQN 训练尽量重叠。
async_rollout = true

[reward]
# Reward V2 的状态塑形总权重。
lambda_phi = 0.5

# 顶部可达投放容量 C(s) 的 potential 权重。
capacity_weight = 0.6

# 水果可恢复性 R(s) 的 potential 权重。
recoverability_weight = 0.3

# 连锁就绪度 K(s) 的 potential 权重；三项权重之和必须为 1。
chain_readiness_weight = 0.1

# 真实终局的可选额外惩罚。Reward V2 默认关闭，失败代价由未来回报归零表达。
terminal_penalty = 0.0

[logging]
# 训练日志：每多少次 update 写一行 metrics 并打印训练日志。
log_interval = 500

# 模型保存：每多少次 update 保存一次 step checkpoint；0 表示关闭周期保存。
save_interval = 20000

# 周期 checkpoint 只滚动保留最近 3 个；latest.pt 和 best.pt 不计入此窗口。
checkpoint_keep_last = 3

# 模型评估：每多少次 update 做一次 greedy 评估；0 表示关闭。
eval_interval = 20000

# 评估局数：每次评估跑多少局游戏。
eval_episodes = 10

# 评估步数：单局评估最多投放多少次，防止极端长局。
eval_max_steps = 500

# 曲线绘图：每多少次 update 生成一次曲线图；0 表示只在结束时尝试生成。
plot_interval = 10000

# 进度心跳：实时进度打印间隔，单位秒。
progress_interval = 3
